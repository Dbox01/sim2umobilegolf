    <!-- Legacy anchor redirects: the old single-page site used hash anchors.
         Runs before React mounts so shared links land on the right page. -->
    <script>
      (function () {
        if (window.location.pathname !== '/' || !window.location.hash) return;
        var map = {
          '#home': '/',
          '#experience': '/gallery',
          '#occasions': '/social-events',
          '#process': '/how-it-works',
          '#tech': '/how-it-works',
          '#pricing': '/packages',
          '#contact': '/contact'
        };
        var target = map[window.location.hash];
        if (target && target !== '/') window.location.replace(target);
      })();
    </script>

    <!-- Google Analytics: live domain only, so staging traffic stays out of your reports -->
    <script>
      if (location.hostname === 'sim2umobilegolf.co.za') {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-F2XNSDKYXM';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-F2XNSDKYXM');
      }
    </script>
