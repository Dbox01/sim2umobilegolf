name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  # Rebuilds the site every morning so photos and videos newly tagged in
  # Cloudinary go live without anyone touching the code.
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC = 05:00 South Africa

  # "Run workflow" button on the Actions tab — use it to publish a new photo
  # immediately instead of waiting for the nightly build.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # This is the ONLY build that is allowed to be indexed. Every other
        # build (local, Cloudflare preview) emits robots.txt with Disallow: /
        # and a noindex meta tag on every page.
        env:
          VITE_SITE_ENV: production
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
